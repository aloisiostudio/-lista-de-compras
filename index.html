<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lista de Compras</title>
<meta name="theme-color" content="#1F3D33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lista">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --chalk-green: #1F3D33;
    --chalk-green-dark: #16291F;
    --paper: #FFFFFF;
    --paper-dim: #EFEDE4;
    --card-bg: #FFFFFF;
    --ink: #22281F;
    --ink-soft: #5B6459;
    --butter: #E8B84B;
    --butter-dark: #C9992F;
    --tomato: #C64B3C;
    --line: #DAD6C9;
    --radius: 14px;
  }
  html[data-theme="dark"]{
    --chalk-green: #16291F;
    --chalk-green-dark: #0E1913;
    --paper: #14171A;
    --paper-dim: #1D2115;
    --card-bg: #1F241C;
    --ink: #EDEAE0;
    --ink-soft: #9BA394;
    --butter: #EFC15D;
    --butter-dark: #C9992F;
    --tomato: #E17A6A;
    --line: #33392E;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background: var(--paper); color: var(--ink); font-family: 'Work Sans', system-ui, sans-serif;
    min-height: 100vh; min-height: 100dvh; display:flex; justify-content:center;
    transition: background 0.25s ease, color 0.25s ease;
  }
  #app{
    width:100%; max-width: 480px; min-height: 100vh; min-height: 100dvh;
    background: var(--paper); display:flex; flex-direction:column; position:relative;
  }

  header{
    position:relative; background: var(--chalk-green);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.03) 0, transparent 40%),
      radial-gradient(circle at 80% 60%, rgba(255,255,255,0.025) 0, transparent 45%);
    padding: calc(28px + env(safe-area-inset-top)) 20px 22px;
    border-bottom-left-radius: 22px; border-bottom-right-radius: 22px;
    box-shadow: 0 6px 18px rgba(22,41,31,0.25);
  }
  .header-actions{ position:absolute; top: calc(18px + env(safe-area-inset-top)); right: 16px; display:flex; gap:8px; }
  .icon-btn{
    width:34px; height:34px; border-radius:10px; border:1px solid rgba(247,245,239,0.25);
    background: rgba(247,245,239,0.08); color: var(--paper);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn svg{ width:17px; height:17px; }
  .icon-btn:active{ background: rgba(247,245,239,0.18); }

  header h1{
    font-family: 'Caveat', cursive; font-weight:700; color: var(--paper);
    font-size: 2.6rem; margin: 0 0 10px; letter-spacing: 0.5px;
  }

  .list-switcher{
    display:inline-flex; align-items:center; gap:7px;
    background: rgba(247,245,239,0.1); border:1px solid rgba(247,245,239,0.22);
    color: var(--paper); border-radius:999px; padding:6px 12px 6px 10px;
    font-size:0.83rem; cursor:pointer; margin-bottom:12px;
  }
  .list-switcher svg{ width:13px; height:13px; opacity:0.85; }
  .list-switcher .lsw-count{ opacity:0.55; font-size:0.76rem; }

  header p#subtitle{ color: rgba(247,245,239,0.65); font-size: 0.9rem; margin: 0 0 18px; }
  .progress-row{ display:flex; align-items:center; gap:10px; }
  .progress-track{ flex:1; height:8px; background: rgba(247,245,239,0.15); border-radius: 999px; overflow:hidden; }
  .progress-fill{ height:100%; background: var(--butter); border-radius: 999px; transition: width 0.35s ease; width:0%; }
  .progress-label{ color: var(--paper); font-size: 0.8rem; font-variant-numeric: tabular-nums; opacity:0.8; white-space:nowrap; }

  .add-form{
    margin: -16px 16px 0; background: var(--card-bg); border-radius: var(--radius);
    box-shadow: 0 4px 14px rgba(22,41,31,0.12); padding: 10px; display:flex; gap:8px;
    position:relative; z-index:2;
  }
  .add-form input[type="text"]{
    flex:1; border:none; background: var(--paper-dim); border-radius: 10px;
    padding: 12px 14px; font-family:'Work Sans', sans-serif; font-size: 1rem; color: var(--ink); min-width:0;
  }
  .add-form input[type="text"]:focus{ outline: 2px solid var(--butter); outline-offset: 1px; }
  .add-form button[type="submit"]{
    background: var(--butter); border:none; color: var(--chalk-green-dark); font-weight:700;
    font-size: 1.4rem; width: 46px; border-radius: 10px; cursor:pointer; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; transition: transform 0.12s ease, background 0.12s ease;
  }
  .add-form button[type="submit"]:active{ transform: scale(0.93); background: var(--butter-dark); }

  .mic-btn{
    width:46px; border:none; border-radius:10px; background: var(--paper-dim); color: var(--chalk-green);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto;
  }
  .mic-btn svg{ width:18px; height:18px; }
  html[data-theme="dark"] .mic-btn{ color: var(--butter); }
  .mic-btn.listening{ background: var(--tomato); color:#fff; animation: mic-pulse 1.2s infinite; }
  @keyframes mic-pulse{
    0%{ box-shadow: 0 0 0 0 rgba(198,75,60,0.45); }
    70%{ box-shadow: 0 0 0 10px rgba(198,75,60,0); }
    100%{ box-shadow: 0 0 0 0 rgba(198,75,60,0); }
  }

  .suggestions{ margin: 6px 16px 0; display:flex; flex-wrap:wrap; gap:6px; position:relative; z-index:2; }
  .suggestion-chip{
    background: var(--card-bg); border:1px dashed var(--line); color: var(--ink-soft);
    padding:5px 11px; border-radius:999px; font-size:0.78rem; cursor:pointer; display:flex; align-items:center; gap:5px;
  }
  .suggestion-chip:active{ background: var(--paper-dim); }
  .suggestion-chip svg{ width:11px; height:11px; opacity:0.6; }

  .category-select{ margin: 10px 16px 0; display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .category-select::-webkit-scrollbar{display:none;}
  .cat-chip{
    flex:0 0 auto; padding:6px 13px; border-radius:999px; border:1px solid var(--line);
    background: var(--paper); font-size:0.82rem; color: var(--ink-soft); cursor:pointer; white-space:nowrap; transition: all 0.15s ease;
  }
  .cat-chip.active{ background: var(--chalk-green); border-color: var(--chalk-green); color: var(--paper); }

  main{ flex:1; padding: 18px 16px calc(100px + env(safe-area-inset-bottom)); overflow-y:auto; }
  .section-title{
    font-size:0.78rem; font-weight:600; color: var(--ink-soft); letter-spacing: 0.02em;
    margin: 22px 4px 8px; display:flex; align-items:center; gap:8px;
  }
  .section-title:first-child{ margin-top:0; }
  .section-title .dot{ width:8px; height:8px; border-radius:50%; background: var(--cat-color, var(--butter)); flex:0 0 auto; }
  .section-title .count{ margin-left:auto; font-weight:400; opacity:0.7; }

  ul.item-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .item{
    display:flex; align-items:center; gap:12px; background: var(--card-bg); border:1px solid var(--line);
    border-radius: 12px; padding: 11px 12px; transition: opacity 0.2s ease, background 0.2s ease;
  }
  .item.done{ background: var(--paper-dim); opacity:0.62; }
  .checkbox{
    flex:0 0 auto; width:24px; height:24px; border-radius:7px; border: 2px solid var(--chalk-green);
    display:flex; align-items:center; justify-content:center; cursor:pointer; background:transparent;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .checkbox svg{ width:14px; height:14px; opacity:0; transition: opacity 0.15s ease; }
  .item.done .checkbox{ background: var(--chalk-green); }
  .item.done .checkbox svg{ opacity:1; }

  .item-main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .item-name{ font-size:0.98rem; color: var(--ink); word-break:break-word; cursor:text; border-bottom:1px dashed transparent; display:inline-block; }
  .item:not(.done) .item-name:active{ border-bottom-color: var(--line); }
  .item.done .item-name{ text-decoration: line-through; text-decoration-color: var(--tomato); color: var(--ink-soft); }
  .item-name-input{
    font-size:0.98rem; padding:2px 4px; border:1px solid var(--line); border-radius:6px;
    background: var(--card-bg); color: var(--ink); width:100%;
  }
  .item-qty{ font-size:0.76rem; color: var(--ink-soft); margin-top:1px; }
  .qty-controls{ display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .qty-btn{
    width:22px; height:22px; border-radius:6px; border:1px solid var(--line); background: var(--paper);
    color: var(--ink-soft); font-size:0.95rem; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .qty-num{ font-size:0.85rem; min-width:16px; text-align:center; color: var(--ink); }
  .delete-btn{
    flex:0 0 auto; width:28px; height:28px; border:none; background:transparent; color: var(--ink-soft);
    cursor:pointer; border-radius:8px; display:flex; align-items:center; justify-content:center;
  }
  .delete-btn:active{ background: rgba(198,75,60,0.12); color: var(--tomato); }

  .empty-state{ text-align:center; padding: 50px 20px; color: var(--ink-soft); }
  .empty-state .chalk{ font-family:'Caveat', cursive; font-size:1.8rem; color: var(--chalk-green); display:block; margin-bottom:6px; }
  html[data-theme="dark"] .empty-state .chalk{ color: var(--butter); }

  .footer-bar{
    position:absolute; bottom:0; left:0; right:0;
    background: linear-gradient(to top, var(--paper) 70%, rgba(247,245,239,0));
    padding: 18px 16px calc(16px + env(safe-area-inset-bottom));
    display:flex; justify-content:center; gap:10px;
  }
  .clear-btn, .share-btn{
    background:none; border:1px solid var(--line); color: var(--ink-soft); padding:9px 18px;
    border-radius:999px; font-size:0.85rem; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .share-btn{ color: var(--chalk-green); border-color: var(--chalk-green); }
  html[data-theme="dark"] .share-btn{ color: var(--butter); border-color: var(--butter); }
  .clear-btn:active, .share-btn:active{ background: var(--paper-dim); }
  .share-btn svg{ width:14px; height:14px; }

  .toast{
    position:fixed; bottom:22px; left:50%; transform: translateX(-50%) translateY(20px);
    background: var(--chalk-green-dark); color: var(--paper); padding: 10px 18px; border-radius: 999px;
    font-size: 0.85rem; opacity:0; pointer-events:none; transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 50; max-width: 90%; text-align:center;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  .undo-toast{
    display:flex; align-items:center; gap:12px; padding:8px 8px 8px 18px; pointer-events:none;
  }
  .undo-toast.show{ pointer-events:auto; }
  .undo-toast button{
    background: var(--butter); color: var(--chalk-green-dark); border:none; padding:7px 14px;
    border-radius:999px; font-size:0.8rem; font-weight:600; cursor:pointer; flex:0 0 auto; white-space:nowrap;
  }

  .install-banner{
    margin: 12px 16px 0; background: var(--butter); color: var(--chalk-green-dark);
    border-radius: 12px; padding: 12px 14px; display:none; align-items:center; gap:10px; font-size:0.85rem;
  }
  .install-banner.show{ display:flex; }
  .install-banner button{
    margin-left:auto; background: var(--chalk-green-dark); color: var(--paper); border:none;
    padding:7px 12px; border-radius:8px; font-size:0.8rem; cursor:pointer; flex:0 0 auto;
  }

  #confettiLayer{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:35; }
  .confetti-piece{ position:absolute; top:-12px; width:8px; height:14px; opacity:0.9; animation: confetti-fall linear forwards; border-radius:2px; }
  @keyframes confetti-fall{ to{ transform: translateY(110vh) rotate(540deg); opacity:0.3; } }

  .list-panel-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.42);
    display:none; align-items:flex-end; justify-content:center; z-index:40;
  }
  .list-panel-overlay.show{ display:flex; }
  .list-panel{
    background: var(--card-bg); width:100%; max-width:480px;
    border-top-left-radius:20px; border-top-right-radius:20px;
    padding: 18px 16px calc(20px + env(safe-area-inset-bottom));
    max-height:78vh; display:flex; flex-direction:column;
  }
  .list-panel-header{ font-weight:600; font-size:1rem; margin-bottom:12px; color:var(--ink); }
  .list-panel-items{ overflow-y:auto; display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .list-row{ display:flex; align-items:center; justify-content:space-between; background: var(--paper-dim); border-radius:10px; padding:10px 12px; gap:8px; }
  .list-row.active{ outline:2px solid var(--butter); outline-offset:-1px; }
  .list-row-main{ display:flex; flex-direction:column; cursor:pointer; flex:1; min-width:0; }
  .list-row-name{ font-size:0.95rem; color:var(--ink); word-break:break-word; }
  .list-row-count{ font-size:0.75rem; color:var(--ink-soft); }
  .list-row-actions{ display:flex; gap:4px; flex:0 0 auto; }
  .list-icon-btn{
    width:28px; height:28px; border:none; background:transparent; color:var(--ink-soft);
    cursor:pointer; border-radius:8px; display:flex; align-items:center; justify-content:center;
  }
  .list-icon-btn svg{ width:14px; height:14px; }
  .list-icon-btn:active{ background: var(--line); }
  .list-rename-input{
    font-size:0.95rem; padding:4px 6px; border-radius:6px; border:1px solid var(--line);
    background: var(--card-bg); color: var(--ink); width:100%;
  }
  .new-list-form{ display:flex; gap:8px; margin-bottom:10px; }
  .new-list-form input{
    flex:1; border:1px solid var(--line); background:var(--paper-dim); border-radius:10px;
    padding:10px 12px; font-size:0.9rem; color:var(--ink);
  }
  .new-list-form button{
    background: var(--chalk-green); color:#F7F5EF; border:none; padding:0 16px; border-radius:10px; cursor:pointer; font-size:0.9rem;
  }
  .backup-row{ display:flex; gap:8px; border-top:1px solid var(--line); padding-top:12px; }
  .backup-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    background: var(--paper-dim); border:1px solid var(--line); color: var(--ink-soft);
    padding:9px 10px; border-radius:10px; font-size:0.8rem; cursor:pointer;
  }
  .backup-btn svg{ width:14px; height:14px; }
  .backup-btn:active{ background: var(--line); }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
    .confetti-piece{ animation: none !important; display:none; }
    .mic-btn.listening{ animation: none !important; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-actions">
      <button class="icon-btn" id="themeBtn" aria-label="Alternar tema"></button>
    </div>
    <h1>Lista de compras</h1>
    <button class="list-switcher" id="listSwitcherBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2 5 6v16h14V6l-4-4"></path><path d="M9 8h6"></path></svg>
      <span id="activeListName">Mercado</span>
      <span class="lsw-count" id="activeListCount">0/0</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>
    <p id="subtitle">Toque em + para adicionar</p>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0/0</div>
    </div>
  </header>

  <div class="install-banner" id="installBanner">
    <span>Instalar na tela inicial?</span>
    <button id="installBtn">Instalar</button>
  </div>

  <form class="add-form" id="addForm">
    <input type="text" id="itemInput" placeholder="Adicionar item..." autocomplete="off" maxlength="60">
    <button type="button" class="mic-btn" id="micBtn" aria-label="Adicionar por voz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
    </button>
    <button type="submit" aria-label="Adicionar">+</button>
  </form>

  <div class="suggestions" id="suggestions"></div>

  <div class="category-select" id="categorySelect"></div>

  <main id="mainList"></main>

  <div class="footer-bar">
    <button class="clear-btn" id="clearBtn">Limpar concluídos</button>
    <button class="share-btn" id="shareBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
      Compartilhar
    </button>
  </div>

  <div class="toast" id="toast"></div>
  <div class="toast undo-toast" id="undoToast">
    <span id="undoToastMsg"></span>
    <button id="undoToastBtn">Desfazer</button>
  </div>
  <div id="confettiLayer"></div>

  <div class="list-panel-overlay" id="listPanelOverlay">
    <div class="list-panel">
      <div class="list-panel-header">Minhas listas</div>
      <div class="list-panel-items" id="listPanelItems"></div>
      <form class="new-list-form" id="newListForm">
        <input type="text" id="newListInput" placeholder="Nome da nova lista" maxlength="30">
        <button type="submit">Criar</button>
      </form>
      <div class="backup-row">
        <button type="button" class="backup-btn" id="exportBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Exportar backup
        </button>
        <button type="button" class="backup-btn" id="importBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          Importar backup
        </button>
        <input type="file" id="importFileInput" accept="application/json" style="display:none">
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const CATEGORIES = [
    { id: 'hortifruti', label: 'Hortifruti', color: '#5C8A5A' },
    { id: 'acougue', label: 'Açougue', color: '#B5544A' },
    { id: 'laticinios', label: 'Laticínios', color: '#D6B24C' },
    { id: 'padaria', label: 'Padaria', color: '#C08A4E' },
    { id: 'mercearia', label: 'Mercearia', color: '#7B8FA1' },
    { id: 'bebidas', label: 'Bebidas', color: '#5A8FA8' },
    { id: 'limpeza', label: 'Limpeza', color: '#6FA8A0' },
    { id: 'higiene', label: 'Higiene', color: '#9878A8' },
    { id: 'outros', label: 'Outros', color: '#8B8B7A' },
  ];

  const KEYWORD_MAP = {
    hortifruti: ['banana','maçã','maca','laranja','alface','tomate','cebola','batata','cenoura','limão','limao','uva','abacate','abacaxi','mamão','mamao','pepino','pimentão','pimentao','morango','manga','melancia','brócolis','brocolis','couve','alho'],
    acougue: ['frango','carne','peixe','bacon','linguiça','linguica','picanha','costela','file','filé','peito','coxa','asa','camarão','camarao'],
    laticinios: ['leite','queijo','iogurte','manteiga','requeijão','requeijao','nata','creme de leite'],
    padaria: ['pão','pao','baguete','croissant','bolo','biscoito','torrada'],
    mercearia: ['arroz','feijão','feijao','macarrão','macarrao','massa','óleo','oleo','açúcar','acucar','sal','farinha','molho','café','cafe','achocolatado','tempero','extrato de tomate'],
    bebidas: ['água','agua','suco','refrigerante','cerveja','vinho','vodka','energético','energetico'],
    limpeza: ['detergente','sabão','sabao','desinfetante','água sanitária','agua sanitaria','esponja','papel toalha','amaciante'],
    higiene: ['papel higiênico','papel higienico','shampoo','sabonete','pasta de dente','creme dental','absorvente','desodorante'],
  };

  function guessCategory(name){
    const lower = name.toLowerCase();
    for(const [cat, words] of Object.entries(KEYWORD_MAP)){
      if(words.some(w => lower.includes(w))) return cat;
    }
    return 'outros';
  }

  const LIST_STORAGE_KEY = 'shopping-lists-v2';
  const OLD_STORAGE_KEY = 'shopping-list-items';
  const HISTORY_KEY = 'shopping-list-history';
  const THEME_KEY = 'shopping-list-theme';

  let appData = { lists: [], activeListId: null };
  let history = [];
  let activeFilter = 'todas';
  let celebrated = false;
  let pendingUndo = null;
  let undoTimeout = null;

  function uid(prefix){ return prefix + Date.now() + Math.random().toString(16).slice(2); }

  const els = {
    form: document.getElementById('addForm'),
    input: document.getElementById('itemInput'),
    micBtn: document.getElementById('micBtn'),
    suggestions: document.getElementById('suggestions'),
    catSelect: document.getElementById('categorySelect'),
    main: document.getElementById('mainList'),
    progressFill: document.getElementById('progressFill'),
    progressLabel: document.getElementById('progressLabel'),
    subtitle: document.getElementById('subtitle'),
    clearBtn: document.getElementById('clearBtn'),
    shareBtn: document.getElementById('shareBtn'),
    toast: document.getElementById('toast'),
    undoToast: document.getElementById('undoToast'),
    undoToastMsg: document.getElementById('undoToastMsg'),
    undoToastBtn: document.getElementById('undoToastBtn'),
    installBanner: document.getElementById('installBanner'),
    installBtn: document.getElementById('installBtn'),
    themeBtn: document.getElementById('themeBtn'),
    confettiLayer: document.getElementById('confettiLayer'),
    listSwitcherBtn: document.getElementById('listSwitcherBtn'),
    activeListName: document.getElementById('activeListName'),
    activeListCount: document.getElementById('activeListCount'),
    listPanelOverlay: document.getElementById('listPanelOverlay'),
    listPanelItems: document.getElementById('listPanelItems'),
    newListForm: document.getElementById('newListForm'),
    newListInput: document.getElementById('newListInput'),
    exportBtn: document.getElementById('exportBtn'),
    importBtn: document.getElementById('importBtn'),
    importFileInput: document.getElementById('importFileInput'),
  };

  // ---- Theme ----
  const sunIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>';
  const moonIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    els.themeBtn.innerHTML = theme === 'dark' ? sunIcon : moonIcon;
  }
  function loadTheme(){
    const saved = localStorage.getItem(THEME_KEY);
    const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(theme);
  }
  els.themeBtn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  });
  loadTheme();

  function showToast(msg){
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> els.toast.classList.remove('show'), 1800);
  }

  // ---- Data: lists ----
  function loadData(){
    let loaded = null;
    try{
      const raw = localStorage.getItem(LIST_STORAGE_KEY);
      if(raw) loaded = JSON.parse(raw);
    }catch(e){}

    if(loaded && loaded.lists && loaded.lists.length){
      appData = loaded;
    } else {
      let migratedItems = [];
      try{
        const oldRaw = localStorage.getItem(OLD_STORAGE_KEY);
        if(oldRaw) migratedItems = JSON.parse(oldRaw) || [];
      }catch(e){}
      const firstList = { id: uid('l'), name: 'Mercado', items: migratedItems };
      appData = { lists: [firstList], activeListId: firstList.id };
      saveData();
    }
    if(!appData.lists.find(l => l.id === appData.activeListId)){
      appData.activeListId = appData.lists[0].id;
    }
    try{ history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }catch(e){ history = []; }
  }
  function saveData(){
    try{ localStorage.setItem(LIST_STORAGE_KEY, JSON.stringify(appData)); }
    catch(e){ showToast('Não foi possível salvar agora'); }
  }
  function getActiveList(){
    return appData.lists.find(l => l.id === appData.activeListId) || appData.lists[0];
  }
  function I(){ return getActiveList().items; }

  function switchList(id){
    appData.activeListId = id;
    activeFilter = 'todas';
    celebrated = false;
    saveData();
    render();
    closeListPanel();
  }
  function createList(name){
    const trimmed = (name || '').trim() || 'Nova lista';
    const list = { id: uid('l'), name: trimmed, items: [] };
    appData.lists.push(list);
    appData.activeListId = list.id;
    saveData();
    render();
    closeListPanel();
    showToast('Lista criada');
  }
  function renameList(id, name){
    const trimmed = (name || '').trim();
    if(!trimmed) { render(); return; }
    const list = appData.lists.find(l => l.id === id);
    if(list) list.name = trimmed;
    saveData();
    render();
  }
  function deleteList(id){
    if(appData.lists.length <= 1){ showToast('Você precisa manter ao menos uma lista'); return; }
    appData.lists = appData.lists.filter(l => l.id !== id);
    if(appData.activeListId === id){ appData.activeListId = appData.lists[0].id; }
    saveData();
    render();
    showToast('Lista removida');
  }

  function saveHistory(){ try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }catch(e){} }
  function pushHistory(name){
    const lower = name.toLowerCase();
    history = history.filter(h => h.toLowerCase() !== lower);
    history.unshift(name);
    if(history.length > 60) history = history.slice(0, 60);
    saveHistory();
  }

  // ---- Sound & haptics ----
  let audioCtx = null;
  function playTick(){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(760, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.13);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.13);
    }catch(e){}
  }
  function vibrate(ms){ if(navigator.vibrate){ try{ navigator.vibrate(ms); }catch(e){} } }

  function launchConfetti(){
    const colors = ['#E8B84B','#5C8A5A','#C64B3C','#5A8FA8','#F7F5EF'];
    for(let i=0;i<28;i++){
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = (Math.random()*100) + 'vw';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      const duration = 1.6 + Math.random()*1.2;
      el.style.animationDuration = duration + 's';
      el.style.animationDelay = (Math.random()*0.3) + 's';
      el.style.transform = `rotate(${Math.random()*360}deg)`;
      els.confettiLayer.appendChild(el);
      setTimeout(() => el.remove(), (duration+0.3)*1000);
    }
  }

  // ---- Undo ----
  function queueUndo(listId, entries, message){
    pendingUndo = { listId, entries };
    els.undoToastMsg.textContent = message;
    els.undoToast.classList.add('show');
    clearTimeout(undoTimeout);
    undoTimeout = setTimeout(() => {
      els.undoToast.classList.remove('show');
      pendingUndo = null;
    }, 5000);
  }
  function performUndo(){
    if(!pendingUndo) return;
    const list = appData.lists.find(l => l.id === pendingUndo.listId);
    if(list){
      const sorted = [...pendingUndo.entries].sort((a,b) => a.index - b.index);
      sorted.forEach(entry => {
        const insertAt = Math.min(entry.index, list.items.length);
        list.items.splice(insertAt, 0, entry.item);
      });
      if(appData.activeListId !== list.id){ appData.activeListId = list.id; activeFilter = 'todas'; }
      celebrated = false;
      saveData();
      render();
      showToast('Restaurado');
    }
    pendingUndo = null;
    clearTimeout(undoTimeout);
    els.undoToast.classList.remove('show');
  }
  els.undoToastBtn.addEventListener('click', performUndo);

  // ---- Items (operate on active list) ----
  function addItem(name){
    const trimmed = name.trim();
    if(!trimmed) return;
    const list = getActiveList();
    list.items.push({ id: uid('i'), name: trimmed, qty: 1, done: false, category: guessCategory(trimmed) });
    pushHistory(trimmed);
    celebrated = false;
    saveData();
    render();
  }
  function renameItem(id, newName){
    const trimmed = (newName || '').trim();
    if(!trimmed){ render(); return; }
    const it = I().find(i => i.id === id);
    if(it){ it.name = trimmed; it.category = guessCategory(trimmed); pushHistory(trimmed); }
    saveData();
    render();
  }
  function toggleDone(id){
    const it = I().find(i => i.id === id);
    if(it){ it.done = !it.done; if(it.done){ vibrate(15); playTick(); } }
    saveData();
    render();
  }
  function changeQty(id, delta){
    const it = I().find(i => i.id === id);
    if(it){ it.qty = Math.max(1, Math.min(99, it.qty + delta)); }
    saveData();
    render();
  }
  function deleteItem(id){
    const list = getActiveList();
    const idx = list.items.findIndex(i => i.id === id);
    if(idx === -1) return;
    const [removed] = list.items.splice(idx, 1);
    saveData();
    render();
    queueUndo(list.id, [{ item: removed, index: idx }], `"${removed.name}" removido`);
  }
  function clearDone(){
    const list = getActiveList();
    const removedEntries = [];
    list.items.forEach((i, idx) => { if(i.done) removedEntries.push({ item: i, index: idx }); });
    if(!removedEntries.length){ showToast('Nada concluído para limpar'); return; }
    list.items = list.items.filter(i => !i.done);
    celebrated = false;
    saveData();
    render();
    queueUndo(list.id, removedEntries, `${removedEntries.length} ${removedEntries.length===1?'item removido':'itens removidos'}`);
  }

  // ---- Share ----
  function buildShareText(){
    const list = getActiveList();
    if(!list.items.length) return `Minha lista "${list.name}" está vazia.`;
    const byCat = {};
    list.items.forEach(i => { (byCat[i.category] = byCat[i.category] || []).push(i); });
    let text = `🛒 ${list.name}\n\n`;
    CATEGORIES.forEach(cat => {
      const catList = byCat[cat.id];
      if(!catList || !catList.length) return;
      text += `${cat.label}\n`;
      catList.forEach(i => {
        const mark = i.done ? '☑' : '☐';
        const qty = i.qty > 1 ? ` (${i.qty})` : '';
        text += `${mark} ${i.name}${qty}\n`;
      });
      text += '\n';
    });
    return text.trim();
  }
  async function shareList(){
    const text = buildShareText();
    if(navigator.share){
      try{ await navigator.share({ title: getActiveList().name, text }); return; }
      catch(e){}
    }
    try{ await navigator.clipboard.writeText(text); showToast('Lista copiada para a área de transferência'); }
    catch(e){ showToast('Não foi possível compartilhar'); }
  }
  els.shareBtn.addEventListener('click', shareList);

  // ---- Backup / restore ----
  function exportBackup(){
    const payload = { version: 1, exportedAt: new Date().toISOString(), appData, history };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `lista-de-compras-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Backup exportado');
  }
  function importBackup(file){
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed.appData || !Array.isArray(parsed.appData.lists) || !parsed.appData.lists.length){
          showToast('Arquivo de backup inválido');
          return;
        }
        const ok = confirm('Isso vai substituir todas as suas listas atuais pelo conteúdo do backup. Continuar?');
        if(!ok) return;
        appData = parsed.appData;
        if(Array.isArray(parsed.history)) history = parsed.history;
        if(!appData.lists.find(l => l.id === appData.activeListId)) appData.activeListId = appData.lists[0].id;
        activeFilter = 'todas';
        celebrated = false;
        saveData();
        saveHistory();
        render();
        closeListPanel();
        showToast('Backup restaurado com sucesso');
      }catch(err){
        showToast('Não foi possível ler o arquivo');
      }
    };
    reader.readAsText(file);
  }
  els.exportBtn.addEventListener('click', exportBackup);
  els.importBtn.addEventListener('click', () => els.importFileInput.click());
  els.importFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(file) importBackup(file);
    els.importFileInput.value = '';
  });

  // ---- Suggestions ----
  function renderSuggestions(){
    const query = els.input.value.trim().toLowerCase();
    const currentNames = new Set(I().map(i => i.name.toLowerCase()));
    let pool = history.filter(h => !currentNames.has(h.toLowerCase()));
    if(query){ pool = pool.filter(h => h.toLowerCase().includes(query) && h.toLowerCase() !== query); }
    pool = pool.slice(0, 6);
    if(!pool.length){ els.suggestions.innerHTML = ''; return; }
    els.suggestions.innerHTML = pool.map(name =>
      `<div class="suggestion-chip" data-name="${escapeHtml(name)}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        ${escapeHtml(name)}
      </div>`
    ).join('');
    els.suggestions.querySelectorAll('.suggestion-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        addItem(chip.dataset.name);
        els.input.value = '';
        els.input.focus();
        renderSuggestions();
      });
    });
  }
  els.input.addEventListener('input', renderSuggestions);
  els.input.addEventListener('focus', renderSuggestions);

  function checkIcon(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="#F7F5EF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 13 10 18 19 7"></polyline></svg>';
  }
  function pencilIcon(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>';
  }
  function trashIcon(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
  }

  function renderCategoryChips(){
    const counts = {};
    I().forEach(i => { if(!i.done) counts[i.category] = (counts[i.category]||0) + 1; });
    const usedCats = CATEGORIES.filter(c => counts[c.id]);
    let html = `<div class="cat-chip ${activeFilter==='todas'?'active':''}" data-cat="todas">Todas</div>`;
    usedCats.forEach(c => { html += `<div class="cat-chip ${activeFilter===c.id?'active':''}" data-cat="${c.id}">${c.label}</div>`; });
    els.catSelect.innerHTML = html;
    els.catSelect.querySelectorAll('.cat-chip').forEach(chip => {
      chip.addEventListener('click', () => { activeFilter = chip.dataset.cat; render(); });
    });
  }

  function updateListSwitcherDisplay(){
    const list = getActiveList();
    els.activeListName.textContent = list.name;
    const total = list.items.length;
    const done = list.items.filter(i=>i.done).length;
    els.activeListCount.textContent = `${done}/${total}`;
  }

  function render(){
    const total = I().length;
    const done = I().filter(i => i.done).length;
    els.progressFill.style.width = total ? `${(done/total)*100}%` : '0%';
    els.progressLabel.textContent = `${done}/${total}`;
    els.subtitle.textContent = total === 0
      ? 'Toque em + para adicionar'
      : (done === total ? 'Tudo pronto! 🎉' : `Faltam ${total - done} ${total-done===1?'item':'itens'}`);

    if(total > 0 && done === total && !celebrated){
      celebrated = true;
      launchConfetti();
      vibrate([15,60,15]);
    }
    if(!(total > 0 && done === total)) celebrated = false;

    updateListSwitcherDisplay();
    renderCategoryChips();
    renderSuggestions();

    if(total === 0){
      els.main.innerHTML = `<div class="empty-state"><span class="chalk">Lista vazia</span>Adicione o primeiro item acima</div>`;
      return;
    }

    const visible = activeFilter === 'todas' ? I() : I().filter(i => i.category === activeFilter || (i.done));
    const pending = visible.filter(i => !i.done);
    const doneItems = visible.filter(i => i.done);

    let html = '';
    if(pending.length){
      const byCat = {};
      pending.forEach(i => { (byCat[i.category] = byCat[i.category] || []).push(i); });
      const orderedCats = CATEGORIES.filter(c => byCat[c.id]);
      orderedCats.forEach(cat => {
        html += `<div class="section-title" style="--cat-color:${cat.color}"><span class="dot"></span>${cat.label}<span class="count">${byCat[cat.id].length}</span></div>`;
        html += `<ul class="item-list">` + byCat[cat.id].map(renderItem).join('') + `</ul>`;
      });
    }
    if(doneItems.length){
      html += `<div class="section-title"><span class="dot" style="--cat-color:#B7B2A0"></span>Concluídos<span class="count">${doneItems.length}</span></div>`;
      html += `<ul class="item-list">` + doneItems.map(renderItem).join('') + `</ul>`;
    }
    if(!pending.length && !doneItems.length){
      html = `<div class="empty-state"><span class="chalk">Nada por aqui</span>Nenhum item nessa categoria</div>`;
    }
    els.main.innerHTML = html;

    els.main.querySelectorAll('[data-action="toggle"]').forEach(el => el.addEventListener('click', () => toggleDone(el.dataset.id)));
    els.main.querySelectorAll('[data-action="inc"]').forEach(el => el.addEventListener('click', () => changeQty(el.dataset.id, 1)));
    els.main.querySelectorAll('[data-action="dec"]').forEach(el => el.addEventListener('click', () => changeQty(el.dataset.id, -1)));
    els.main.querySelectorAll('[data-action="delete"]').forEach(el => el.addEventListener('click', () => deleteItem(el.dataset.id)));
    els.main.querySelectorAll('[data-action="edit-name"]').forEach(el => el.addEventListener('click', () => startEditItemName(el.dataset.id)));
  }

  function startEditItemName(id){
    const nameEl = els.main.querySelector(`.item-name[data-id="${id}"]`);
    if(!nameEl) return;
    const it = I().find(i => i.id === id);
    if(!it) return;
    const input = document.createElement('input');
    input.type = 'text';
    input.value = it.name;
    input.className = 'item-name-input';
    input.maxLength = 60;
    nameEl.replaceWith(input);
    input.focus();
    input.select();
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ input.blur(); } });
    input.addEventListener('blur', () => renameItem(id, input.value), { once: true });
  }

  function renderItem(it){
    return `
      <li class="item ${it.done ? 'done' : ''}">
        <div class="checkbox" data-action="toggle" data-id="${it.id}">${checkIcon()}</div>
        <div class="item-main">
          <div class="item-name" data-action="edit-name" data-id="${it.id}">${escapeHtml(it.name)}</div>
          ${it.qty > 1 ? `<div class="item-qty">Qtd: ${it.qty}</div>` : ''}
        </div>
        <div class="qty-controls">
          <button class="qty-btn" data-action="dec" data-id="${it.id}">−</button>
          <span class="qty-num">${it.qty}</span>
          <button class="qty-btn" data-action="inc" data-id="${it.id}">+</button>
        </div>
        <button class="delete-btn" data-action="delete" data-id="${it.id}" aria-label="Remover">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </li>`;
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---- List panel ----
  function renderListPanel(){
    const html = appData.lists.map(l => {
      const count = l.items.length;
      const doneCount = l.items.filter(i=>i.done).length;
      const isActive = l.id === appData.activeListId;
      return `<div class="list-row ${isActive?'active':''}" data-id="${l.id}">
        <div class="list-row-main" data-action="switch" data-id="${l.id}">
          <span class="list-row-name">${escapeHtml(l.name)}</span>
          <span class="list-row-count">${doneCount}/${count} itens</span>
        </div>
        <div class="list-row-actions">
          <button class="list-icon-btn" data-action="rename" data-id="${l.id}" aria-label="Renomear">${pencilIcon()}</button>
          <button class="list-icon-btn" data-action="delete-list" data-id="${l.id}" aria-label="Excluir">${trashIcon()}</button>
        </div>
      </div>`;
    }).join('');
    els.listPanelItems.innerHTML = html;
    els.listPanelItems.querySelectorAll('[data-action="switch"]').forEach(el => el.addEventListener('click', () => switchList(el.dataset.id)));
    els.listPanelItems.querySelectorAll('[data-action="rename"]').forEach(el => el.addEventListener('click', (e) => { e.stopPropagation(); startRename(el.dataset.id); }));
    els.listPanelItems.querySelectorAll('[data-action="delete-list"]').forEach(el => el.addEventListener('click', (e) => {
      e.stopPropagation();
      if(confirm('Excluir esta lista e todos os itens dela?')) deleteList(el.dataset.id);
    }));
  }
  function startRename(id){
    const row = els.listPanelItems.querySelector(`.list-row[data-id="${id}"] .list-row-name`);
    if(!row) return;
    const list = appData.lists.find(l => l.id === id);
    const input = document.createElement('input');
    input.type = 'text';
    input.value = list.name;
    input.className = 'list-rename-input';
    input.maxLength = 30;
    row.replaceWith(input);
    input.focus();
    input.select();
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ input.blur(); } });
    input.addEventListener('blur', () => renameList(id, input.value), { once: true });
  }
  function openListPanel(){ renderListPanel(); els.listPanelOverlay.classList.add('show'); els.newListInput.value = ''; }
  function closeListPanel(){ els.listPanelOverlay.classList.remove('show'); }
  els.listSwitcherBtn.addEventListener('click', openListPanel);
  els.listPanelOverlay.addEventListener('click', (e) => { if(e.target === els.listPanelOverlay) closeListPanel(); });
  els.newListForm.addEventListener('submit', (e) => { e.preventDefault(); createList(els.newListInput.value); });

  els.form.addEventListener('submit', (e) => {
    e.preventDefault();
    addItem(els.input.value);
    els.input.value = '';
    els.input.focus();
    renderSuggestions();
  });
  els.clearBtn.addEventListener('click', clearDone);

  loadData();
  render();

  // ---- Voice input ----
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(SpeechRecognitionCtor){
    const recognition = new SpeechRecognitionCtor();
    recognition.lang = 'pt-BR';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    let listening = false;

    recognition.addEventListener('start', () => {
      listening = true;
      els.micBtn.classList.add('listening');
      showToast('Ouvindo... diga os itens');
    });
    recognition.addEventListener('end', () => {
      listening = false;
      els.micBtn.classList.remove('listening');
    });
    recognition.addEventListener('error', (e) => {
      listening = false;
      els.micBtn.classList.remove('listening');
      if(e.error === 'not-allowed' || e.error === 'permission-denied') showToast('Permissão de microfone negada');
      else if(e.error === 'no-speech') showToast('Não ouvi nada, tenta de novo');
      else showToast('Erro no reconhecimento de voz');
    });
    recognition.addEventListener('result', (e) => {
      const transcript = e.results[0][0].transcript || '';
      const parts = transcript.split(/,| e |\n/gi).map(s => s.trim()).filter(Boolean);
      if(!parts.length) return;
      parts.forEach(p => addItem(p));
      showToast(parts.length > 1 ? `${parts.length} itens adicionados` : `"${parts[0]}" adicionado`);
    });
    els.micBtn.addEventListener('click', () => {
      if(listening){ recognition.stop(); return; }
      try{ recognition.start(); }catch(e){}
    });
  } else {
    els.micBtn.style.display = 'none';
  }

  // ---- PWA install prompt ----
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    els.installBanner.classList.add('show');
  });
  els.installBtn.addEventListener('click', async () => {
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    els.installBanner.classList.remove('show');
  });
  window.addEventListener('appinstalled', () => { els.installBanner.classList.remove('show'); });

  // ---- Service worker registration ----
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
